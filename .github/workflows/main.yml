on:
  pull_request:
    branches: [master, main]
    
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@master

      - name: query GH api  
        run: |
          numAdditions="$(gh api repos/$OWNER/$REPO/pulls/$PR_NUMBER --jq '.additions')"
          echo 'NUM_ADDITIONS='$numAdditions >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}          
          PR_NUMBER: ${{ github.event.number }}

      - name: Log api results
        run: echo "additions $NUM_ADDITIONS"
          
      - name: Use Github Action to set Status of item on monday.com
        uses: ghoti143/action-monday-state@main
        with:
          monday-token: ${{ secrets.MONDAY_TOKEN }}
          text: ${{ github.event.pull_request.title }}
          status-column-title: 'Additions'
          set-status: ${{ env.NUM_ADDITIONS }}
